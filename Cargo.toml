[package]
name = "brute"
version = "0.5.0"
edition = "2021"
authors = ["Waowzar"]
description = "Brute — a programming language combining features from Rust, Python, and C/C++"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Waowzar/brute"

[features]
# The LLVM backend is optional. It is only required for `brute compile`
# (native code generation). The interpreter (`run`, `check`, `format`)
# builds and works without LLVM installed.
default = []
llvm = ["dep:inkwell", "dep:tempfile"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.0"
lazy_static = "1.4"

# Native code generation (optional — needs LLVM 16 installed)
inkwell = { version = "0.2.0", features = ["llvm16-0"], optional = true }
tempfile = { version = "3.8", optional = true }

# Standard library
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"

[lib]
name = "brute"
path = "src/lib.rs"

[[bin]]
name = "brute"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
