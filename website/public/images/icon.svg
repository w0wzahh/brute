<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Neobrutalist Brute mark — flat yellow block, hard offset, B! monogram -->
  <!-- hard offset shadow -->
  <rect x="48" y="48" width="424" height="424" rx="20" fill="#000"/>
  <!-- main block -->
  <rect x="24" y="24" width="424" height="424" rx="20" fill="#facc00" stroke="#000" stroke-width="10"/>
  <!-- B! monogram -->
  <text x="196" y="336" font-family="'Archivo Black','Arial Black',Arial,sans-serif"
        font-size="280" font-weight="900" text-anchor="middle" fill="#000">B</text>
  <text x="366" y="336" font-family="'Archivo Black','Arial Black',Arial,sans-serif"
        font-size="280" font-weight="900" text-anchor="middle" fill="#ff6b9d"
        stroke="#000" stroke-width="6" paint-order="stroke">!</text>
  <!-- corner rivets -->
  <g fill="#000">
    <circle cx="70" cy="70" r="12"/>
    <circle cx="402" cy="70" r="12"/>
    <circle cx="70" cy="402" r="12"/>
    <circle cx="402" cy="402" r="12"/>
  </g>
</svg>
